schemaVersion: "2"
kind: sandbox
name: omp
displayName: OMP
description: The omp coding agent (oh-my-pi) — runs inside a Docker sbx sandbox.

sandbox:
  image: "omp-sbx:latest"
  entrypoint: [omp-init.sh]

credentials:
  - service: anthropic
    apiKey:
      name: ANTHROPIC_API_KEY
      proxyManaged: true
      inject:
        - domain: api.anthropic.com
          header: x-api-key
          format: "%s"
  - service: openai
    oauth:
      tokenEndpoint:
        host: auth.openai.com
        path: /oauth/token
      sentinels:
        accessToken: oai-oat01-proxy-managed
        refreshToken: oai-ort01-proxy-managed
      resourceHosts:
        - chatgpt.com
        - api.openai.com
  - service: google
    apiKey:
      name: GEMINI_API_KEY
      proxyManaged: true
      inject:
        - domain: generativelanguage.googleapis.com
          header: x-goog-api-key
          format: "%s"
  - service: groq
    apiKey:
      name: GROQ_API_KEY
      proxyManaged: true
      inject:
        - domain: api.groq.com
          header: Authorization
          format: "Bearer %s"
  - service: mistral
    apiKey:
      name: MISTRAL_API_KEY
      proxyManaged: true
      inject:
        - domain: api.mistral.ai
          header: Authorization
          format: "Bearer %s"
  - service: openrouter
    apiKey:
      name: OPENROUTER_API_KEY
      proxyManaged: true
      inject:
        - domain: openrouter.ai
          header: Authorization
          format: "Bearer %s"
  - service: xai
    apiKey:
      name: XAI_API_KEY
      proxyManaged: true
      inject:
        - domain: api.x.ai
          header: Authorization
          format: "Bearer %s"
agentInstructions:
  filename: AGENTS.md
  content: |
    ## Sandbox environment

    You are running inside a Docker sbx sandbox (microVM). The workspace is
    mounted at `/home/agent/workspace`; OMP state is mounted at
    `/home/agent/.omp`. The host launcher assigns a different persistent state
    directory to each sandbox, so logins, settings, sessions, memories, and
    SQLite files survive recreation without cross-VM writers.

    Docker is available inside the sandbox through the sandbox-local daemon at
    `/var/run/docker.sock`. Do not mount or use the host Docker socket; `docker ps`
    should show containers that belong to this sbx microVM only.

    External Docker images are restricted by a host-approved snapshot of the
    optional project `.omp-sbx-docker-images.yaml`. The snapshot is outside the
    writable workspace, mounted read-only, and enforced by Docker AuthZ. If no
    project policy was approved, every external image is denied. Project edits
    do not change the active policy; the user must run the host launcher with
    `--refresh-image-policy`, which recreates the sandbox.

    Use unqualified names or the `local/` prefix for local build outputs. Use
    `docker buildx bake -f compose.yaml` for Compose builds; `docker compose
    build` and `docker compose up --build` are rejected because Compose cannot
    require the sandbox Buildx policy.

    This image policy is an operational guardrail. Passwordless `sudo` can
    reconfigure Docker, and Docker AuthZ does not cover native/upgraded gRPC.

    GitHub authentication is forwarded from the host: `gh` CLI commands work
    directly, and `git push` over HTTPS uses the gh credential helper (no
    separate token or SSH setup needed). If `gh auth status` fails, the host's
    `~/.config/gh` is not mounted — recreate the sandbox with `omp-sbx --new`.

    `sudo` is passwordless; use it for system package installs.


    OMP's Eval `browser` API is enabled and uses the Chromium installed at
    `/usr/local/bin/chromium`. Open it with `await browser.open(...)`; use
    `observe`, `click`, `fill`, and `screenshot` on the returned tab. The sbx
    TLS proxy intercepts HTTPS. Its CA is injected into the container trust
    store at runtime, so Chromium validates certificates normally; do not
    enable a certificate-error bypass. For static web content (articles, docs,
    JSON, PDFs), prefer the `read` tool on a URL.

# ── Network ──────────────────────────────────────────────────────────────────
permissions:
  network:
    allow:
      # Model provider APIs
      - "api.anthropic.com:443"
      - "api.openai.com:443"
      - "auth.openai.com:443"
      - "chatgpt.com:443"
      - "generativelanguage.googleapis.com:443"
      - "api.groq.com:443"
      - "api.mistral.ai:443"
      - "openrouter.ai:443"
      - "api.x.ai:443"
      - "*.opencode.ai:443"
      # Amazon Bedrock, us-east-1. Add the hosts for another region to use it.
      - "bedrock-runtime.us-east-1.amazonaws.com:443"
      - "bedrock.us-east-1.amazonaws.com:443"
      # omp release metadata, downloads and self-update
      - "api.github.com:443"
      - "github.com:443"
      - "*.githubusercontent.com:443"
      - "raw.githubusercontent.com:443"
      # Package registries (npm, pip, cargo)
      - "registry.npmjs.org:443"
      - "pypi.org:443"
      - "files.pythonhosted.org:443"
      - "index.crates.io:443"
      - "static.crates.io:443"
      # Local model servers on the host
      - "host.docker.internal:*"
      # Docs and context providers
      - "*.context7.com:443"
      - "code.visualstudio.com:443"
      - "*.cloudflare.com:443"
      # Playwright browser downloads
      - "cdn.playwright.dev:443"
      - "playwright.download.prss.microsoft.com:443"

# ── Environment ──────────────────────────────────────────────────────────────
environment:
  variables:
    # .omp resolves to the per-sandbox persistent state symlink.
    PI_CONFIG_DIR: ".omp"
    HOME: "/home/agent"
    # OMP's openai-codex provider sends this sentinel to chatgpt.com; sbx swaps
    # the real OAuth access token into the outbound request.
    OPENAI_CODEX_OAUTH_TOKEN: "oai-oat01-proxy-managed"
    GH_CONFIG_DIR: "/home/agent/.config/gh"
    # Force OMP/Puppeteer to use the architecture-native Chromium in the image.
    PUPPETEER_EXECUTABLE_PATH: "/usr/local/bin/chromium"

setup:
  startup:
    - command:
        - "bash"
        - "-c"
        - |
          # ~/.omp is symlinked in omp-init.sh instead - this hook races omp's
          # own startup and loses.
          GH_HOST=$(mount | grep 'type virtiofs' | grep '/.config/gh ' | sed 's/.* on //; s/ type.*//' | head -1)
          if [ -n "$GH_HOST" ] && [ "$GH_HOST" != "$HOME/.config/gh" ]; then
            mkdir -p "$HOME/.config"
            rm -rf "$HOME/.config/gh"
            ln -sfn "$GH_HOST" "$HOME/.config/gh"
          fi
          # Point git at gh's credential helper, so `git push` over HTTPS uses
          # the mounted session. hosts.yml is the only check possible here:
          # `gh auth status` needs github.com, which may not be reachable yet.
          if [ -f "$HOME/.config/gh/hosts.yml" ]; then
            gh auth setup-git 2>/dev/null || true
          fi
          # Trust WORKSPACE_DIR for the host mount path. Scanning `mount`
          # instead would also match /etc/hosts, another virtiofs mount.
          WS_HOST="${WORKSPACE_DIR:-}"
          if [ -d "$WS_HOST" ] && [ "$WS_HOST" != "/home/agent/workspace" ]; then
            rm -rf /home/agent/workspace
            ln -sfn "$WS_HOST" /home/agent/workspace
          else
            echo "omp-sbx: workspace mount unavailable: ${WS_HOST:-unset}" >&2
            exit 1
          fi
      user: "1000"
      description: Symlink host mounts and configure the gh credential helper
