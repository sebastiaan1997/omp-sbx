schemaVersion: "1"
# omp-sbxenv fills these in at launch: one file serves every project
# directory, so nothing here is hardcoded.
name: ${OMP_SBXENV_NAME}
agent: omp
kits:
  - ${OMP_SBXENV_KIT_DIR}
workspace: ${OMP_SBXENV_WORKSPACE}
additionalWorkspaces:
  # Host ~/.omp keeps sessions, skills and memories across restarts. It has
  # to exist: `sbx env create` prompts for a missing path, so CI hangs.
  - path: ${HOME}/.omp
  # Per-project Docker image allowlist, mounted separately from the rw workspace.
  - path: ${OMP_SBXENV_DOCKER_POLICY}
    readOnly: true
sandboxOptions:
  template: omp-sbx:latest
