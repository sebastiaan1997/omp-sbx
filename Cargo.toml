[workspace]
members = ["crates/omp-sbx"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/mikeatlas/omp-sbx"

[workspace.dependencies]
anyhow = "1.0"
atomic-write-file = "0.3"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29"] }
directories = "6.0"
fs4 = "0.13"
hex = "0.4"
include_dir = "0.7"
libc = "0.2"
nix = { version = "0.30", features = ["fs", "process", "signal", "socket", "user"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.23"
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
yaml-rust2 = "0.10"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
